
name: CI - Calculadora Java

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes-unitarios:
    name: Testes unitarios com JUnit
    runs-on: ubuntu-latest

    steps:
      - name: Obter o codigo do repositorio
        uses: actions/checkout@v7

      - name: Configurar o Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Executar os testes com Maven
        run: mvn -B --no-transfer-progress test
