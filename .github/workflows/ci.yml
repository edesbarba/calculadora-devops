
name: CI - Calculadora Java

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  testes-unitarios:
    name: JUnit - 6 testes unitarios
    runs-on: ubuntu-24.04

    steps:
      - name: Obter codigo do repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Executar testes unitarios
        run: mvn -B --no-transfer-progress test

  testes-aceitacao:
    name: Selenium - 3 testes de aceitacao
    runs-on: ubuntu-24.04

    steps:
      - name: Obter codigo do repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Conferir navegador Chrome
        run: google-chrome --version

      - name: Executar Selenium em modo headless
        run: mvn -B --no-transfer-progress -Dselenium.headless=true test-compile failsafe:integration-test failsafe:verify
